[alembic]
script_location = migrations
prepend_sys_path = src
# The URL is resolved at runtime from DRAFTGPT_DATABASE_URL; this is only a
# fallback so `alembic` works with no environment configured.
sqlalchemy.url = sqlite:///./data/draftgpt.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
