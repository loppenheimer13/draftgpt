[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huddle"
version = "0.1.0"
description = "Daily fantasy football audio digests, published to a Yoto player."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    # Encrypts Yoto refresh tokens at rest.
    "cryptography>=42.0",
    # nflverse data access: player identity, schedule, injuries, depth charts,
    # usage, weather, betting context. Data is CC-BY-4.0 (attributed).
    "nflreadpy>=0.1.5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]
postgres = ["psycopg[binary]>=3.1"]
narration = ["anthropic>=0.34"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "httpx>=0.27",
]

[project.scripts]
huddle = "huddle.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/huddle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic revision files are generated; reformatting them obscures the diff
# against what autogenerate produces.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["huddle"]
mypy_path = "src"
ignore_missing_imports = true
