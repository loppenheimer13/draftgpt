[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "draftgpt"
version = "0.1.0"
description = "League-specific fantasy football decision engine. Read-only, database-authoritative."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    # nflverse data access: player ID crosswalk, schedule, injuries, depth
    # charts, usage, weather, betting context. Data is CC-BY-4.0 (attributed).
    "nflreadpy>=0.1.5",
]

[project.optional-dependencies]
# The server targets the mcp 2.x API (constructor callbacks, not decorators).
mcp = ["mcp>=2.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
draftgpt = "draftgpt.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/draftgpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic revision files are generated; reformatting them obscures the diff
# against what autogenerate produces.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["draftgpt"]
mypy_path = "src"
ignore_missing_imports = true
